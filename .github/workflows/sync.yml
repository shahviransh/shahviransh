name: Sync resume PDFs

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Pull resume PDFs from McMaster-University
        env:
          TOKEN: ${{ secrets.RESUME }}
        run: |
          set -euo pipefail

          if [ -z "${TOKEN}" ]; then
            echo "Missing secrets.RESUME (PAT that can read shahviransh/McMaster-University)"
            exit 1
          fi

          git clone --depth 1 --filter=blob:none --sparse \
            "https://x-access-token:${TOKEN}@github.com/shahviransh/McMaster-University.git" \
            mcmaster

          git -C mcmaster sparse-checkout set "Resume Software" "Resume Security"

          software="mcmaster/Resume Software/Viransh-Shah-Resume-Software-Development.pdf"
          security="mcmaster/Resume Security/Viransh-Shah-Resume-Security.pdf"

          if [ ! -s "$software" ] || [ ! -s "$security" ]; then
            echo "Expected resume PDFs were not in the sparse checkout:"
            find mcmaster -name '*.pdf' -print || true
            exit 1
          fi

          mkdir -p public
          cp "$software" public/Viransh-Shah-Resume-Software-Development.pdf
          cp "$security" public/Viransh-Shah-Resume-Security.pdf
          rm -rf mcmaster

      - name: Commit synced PDFs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add public/Viransh-Shah-Resume-Software-Development.pdf \
                  public/Viransh-Shah-Resume-Security.pdf
          git rm --ignore-unmatch \
            Resume.pdf \
            Viransh-Shah-Resume-Software-Development.pdf \
            Viransh-Shah-Resume-Security.pdf

          if git diff --cached --quiet; then
            echo "No resume PDF changes"
            exit 0
          fi

          git commit -m "Sync resume PDFs from McMaster-University"
          git push origin HEAD
